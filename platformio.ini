; =============================================================================
; STERN OS — Pocket Cyberdeck (Barkleys Tin & Handhelds)
; Multi-Chip (ESP32-WROOM, WROVER, S3, C3) & Multi-Display PlatformIO Config
; =============================================================================

[platformio]
default_envs = esp32-wroom

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; Optimierte Compiler-Flags: -Os (Size-Optimized) + Dead-Code Linker Elimination (-Wl,--gc-sections)
build_unflags =
    -flto
    -O3

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -DARDUINO_ARCH_ESP32
    -DFRAMESKIP
    -DCORE_DEBUG_LEVEL=0
    -DSPI_FREQUENCY=80000000
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

build_type = release

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
    arduino-libraries/NTPClient @ ^3.2.1
    tzapu/WiFiManager @ ^2.0.0
    adafruit/Adafruit TCA8418 @ ^1.0.0
    adafruit/Adafruit BusIO @ ^1.0.0
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit SSD1306 @ ^2.5.7
    https://github.com/phenax/Anemoia-ESP32.git

; =============================================================================
; Chip Target 1: ESP32-WROOM / ESP32-DevKitC (4MB Flash, No PSRAM)
; Standard-Board im Barkleys Tin Cyberdeck
; =============================================================================
[env:esp32-wroom]
board = esp32dev
board_build.f_cpu = 240000000L
board_build.partitions = partitions/no_ota_4mb.csv

; Alias für Kompatibilität mit bestehenden Scripts / Tools
[env:esp32dev]
extends = env:esp32-wroom

; =============================================================================
; Chip Target 2: ESP32-WROVER (4MB / 8MB Flash + PSRAM)
; Mehr RAM für größere Emulatoren, Caching und Framebuffer
; =============================================================================
[env:esp32-wrover]
board = esp-wrover-kit
board_build.f_cpu = 240000000L
board_build.partitions = partitions/no_ota_8mb.csv
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; =============================================================================
; Chip Target 3: ESP32-S3 (Dual-Core Xtensa LX7, USB OTG/CDC, 8MB Flash, PSRAM)
; Ideal für moderne Cyberdeck Handhelds (z.B. LilyGO T-Deck / Cardputer)
; =============================================================================
[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.partitions = partitions/no_ota_8mb.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; =============================================================================
; Chip Target 4: ESP32-C3 (RISC-V Single-Core, kompakter Footprint)
; =============================================================================
[env:esp32-c3]
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
board_build.partitions = partitions/no_ota_4mb.csv

; =============================================================================
; Display Variante: ST7735 (128x160 Display Profile)
; =============================================================================
[env:esp32-st7735]
extends = env:esp32-wroom
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -DARDUINO_ARCH_ESP32
    -DFRAMESKIP
    -DCORE_DEBUG_LEVEL=0
    -DSPI_FREQUENCY=27000000
    -DDISPLAY_TYPE_ST7735_128x160=1
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB=1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1

; =============================================================================
; Display Variante: ILI9341 (320x240 Display Profile)
; =============================================================================
[env:esp32-ili9341]
extends = env:esp32-wroom
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -fno-exceptions
    -fno-rtti
    -fno-threadsafe-statics
    -DARDUINO_ARCH_ESP32
    -DFRAMESKIP
    -DCORE_DEBUG_LEVEL=0
    -DSPI_FREQUENCY=40000000
    -DDISPLAY_TYPE_ILI9341=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1